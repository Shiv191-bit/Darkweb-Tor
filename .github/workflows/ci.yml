name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile backend/app/main.py backend/app/services/safety.py backend/app/workers/scheduler.py collectors/base.py collectors/archive_html.py scripts/build_normalized_archive.py scripts/run_archive_ingest.py
      - run: python -m json.tool config/sources.allowlist.json > /dev/null
