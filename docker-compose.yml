services:
  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    ports:
      - "4173:4173"
    environment:
      DATABASE_URL: postgresql+psycopg://darktrace:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/darktrace
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      LIVE_COLLECTION_ENABLED: "false"
      SOURCE_ALLOWLIST_FILE: /app/config/sources.allowlist.json
      TOR_SOCKS_URL: socks5://tor:9050
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    command: ["python", "-m", "backend.app.workers.scheduler"]
    environment:
      LIVE_COLLECTION_ENABLED: "false"
      SOURCE_ALLOWLIST_FILE: /app/config/sources.allowlist.json
      TOR_SOCKS_URL: socks5://tor:9050
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    depends_on:
      - redis
      - tor
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: darktrace
      POSTGRES_USER: darktrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darktrace -d darktrace"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  tor:
    build:
      context: infra/tor
    read_only: true
    tmpfs:
      - /var/lib/tor
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
